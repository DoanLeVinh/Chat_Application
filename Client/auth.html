<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Đăng nhập / Đăng ký</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <div class="logo-icon">💬</div>
                <h1>Chat App</h1>
            </div>
            
            <div class="tabs">
                <button class="tab active" data-tab="login">Đăng nhập</button>
                <button class="tab" data-tab="register">Đăng ký</button>
            </div>

            <form id="loginForm" class="form active">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Đăng nhập</button>
            </form>

            <form id="registerForm" class="form">
                <div class="form-group">
                    <label for="registerName">Tên hiển thị</label>
                    <input type="text" id="registerName" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Mật khẩu</label>
                    <input type="password" id="registerPassword" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Đăng ký</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="js/app.js?v=2026012101"></script>
</body>
</html>
